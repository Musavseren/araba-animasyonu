
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Araba Animasyonu</title>
  <link rel="stylesheet" href="main.css">
  <script src="main.js" defer></script>
</head>
<body>
  <main class="scene">
    <h1>Araba Animasyonu</h1>
<p id="animationStatus" role="status" aria-live="polite">Hazır</p>
    <p>Başlat düğmesine basarak arabayı hareket ettir.</p>

    <div class="road">
      <img id="car" src="car.svg" alt="Animasyonlu araba">
    </div>
<label for="speedControl">Araba hızı:</label>
<input
  id="speedControl"
  type="range"
  min="0.05"
  max="0.5"
  step="0.05"
  value="0.15"
>
<output id="speedValue" for="speedControl">0.15</output>
>
    <button id="startButton" type="button">Başlat</button>
    <button id="pauseButton" type="button">Duraklat</button>
    <button id="resetButton" type="button">Sıfırla</button>
  
  </main>
</body>
</html>
